<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程伦理情景模拟 - 多轮分支故事</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .scenario {
            background: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 5px solid #3498db;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        .options button {
            padding: 10px 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options button:hover {
            background: #2980b9;
        }
        .custom-option {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .custom-option input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .custom-option button {
            padding: 10px 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .analysis {
            background: #e8f8f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 5px solid #2ecc71;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
        }
        .loading {
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
            margin: 10px 0;
        }
        .profession-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .profession-buttons button {
            padding: 10px 20px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin: 10px 0;
        }
        hr {
            margin: 20px 0;
        }
        #roundInfo {
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>工程伦理情景模拟</h1>
    <div id="story">
        <div id="roundInfo"></div>
        <div id="scenario" class="scenario"></div>
        <div id="options" class="options"></div>
        <div id="customOption" class="custom-option">
            <input type="text" id="customInput" placeholder="或者输入你自己的行动方案...">
            <button id="customBtn">提交自定义选项</button>
        </div>
        <div id="analysis" class="analysis" style="display: none;"></div>
        <div id="imageContainer"></div>
        <div id="loading" class="loading" style="display: none;">正在生成图片...</div>
        <div id="error" class="error" style="display: none;"></div>
    </div>
</div>

<script>
    // ========== 配置 ==========
    // ⚠️ 请替换为你的真实值
    const COZE_TOKEN = 'cztei_qo2wRbXWPIXjslSPTqmAJBz46g82lbtT2kWd5mMq3zt8H3cAt6Z6OOTxS5USFRKWD';
    const WORKFLOW_ID = '7619582633346777140';               // 替换
    const IMAGE_PLUGIN_ID = '';     // 替换（可选，如果不需要图片可置空）

    // ========== 全局状态 ==========
    let profession = '';
    let currentRound = 1;          // 当前轮次（1-5）
    let historySummary = '';       // 累积的历史（每轮情景+选择）
    let currentScenario = '';      // 当前轮次的情景（用于记录历史）
    let currentOptions = null;     // 当前轮次的选项（A、B、C、D）

    // ========== Coze API 调用函数 ==========
    /**
     * 调用 Coze 工作流
     * @param {Object} parameters 工作流输入参数
     * @returns {Promise<Object>} 工作流返回的 data 字段
     */
    async function callWorkflow(parameters) {
        console.log('开始调用Coze API...');
        console.log('API端点:', 'https://api.coze.cn/v1/workflow/run');
        console.log('工作流ID:', WORKFLOW_ID);
        console.log('Authorization:', `Bearer ${COZE_TOKEN.substring(0, 10)}...`);
        
        try {
            const response = await fetch('https://api.coze.cn/v1/workflow/run', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${COZE_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    workflow_id: WORKFLOW_ID,
                    parameters: parameters
                })
            });
            
            console.log('Response status:', response.status);
            console.log('Response headers:', Object.fromEntries(response.headers));
            
            const data = await response.json();
            console.log('API返回数据:', data);
            
            if (data.code !== 0) throw new Error(data.msg);
            
            // 检查data.data是否为字符串，如果是则解析为对象
            let result = data.data;
            if (typeof result === 'string') {
                try {
                    result = JSON.parse(result);
                    console.log('解析后的data.data:', result);
                } catch (parseError) {
                    console.error('解析data.data失败:', parseError);
                    // 尝试修复JSON格式
                    try {
                        // 替换可能的格式问题
                        let fixedJson = result;
                        // 修复常见的JSON格式错误
                        // 1. 修复缺少的逗号和括号
                        fixedJson = fixedJson.replace(/{"analysis":""/g, '{"analysis":"",');
                        fixedJson = fixedJson.replace(/"options":""/g, '"options":{');
                        fixedJson = fixedJson.replace(/"scenario"/g, '},"scenario"');
                        // 2. 确保末尾有正确的闭合括号
                        if (!fixedJson.endsWith('}')) {
                            fixedJson = fixedJson + '}';
                        }
                        result = JSON.parse(fixedJson);
                        console.log('修复后解析的data.data:', result);
                    } catch (fixError) {
                        console.error('修复JSON失败:', fixError);
                        // 如果修复失败，尝试手动构建对象
                        try {
                            // 提取scenario和options
                            const scenarioMatch = result.match(/"scenario":"([^"]+)"/);
                            const optionsMatch = result.match(/"options":\{([^\}]+)\}/);
                            
                            result = {
                                analysis: '',
                                scenario: scenarioMatch ? scenarioMatch[1] : '未获取到场景',
                                options: optionsMatch ? {
                                    A: '选项A',
                                    B: '选项B', 
                                    C: '选项C',
                                    D: '选项D'
                                } : {}
                            };
                            console.log('手动构建的对象:', result);
                        } catch (manualError) {
                            console.error('手动构建对象失败:', manualError);
                        }
                    }
                }
            }
            
            return result;
        } catch (error) {
            console.error('API调用失败:', error);
            throw error;
        }
    }

    /**
     * 调用图片生成插件（可选）
     * @param {string} prompt 图片描述词
     * @returns {Promise<string>} 图片URL
     */
    async function generateImage(prompt) {
        if (!IMAGE_PLUGIN_ID) return '';
        const response = await fetch(`https://api.coze.cn/v1/plugin/${IMAGE_PLUGIN_ID}/invoke`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${COZE_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                input: { image_prompt: prompt }
            })
        });
        const data = await response.json();
        if (data.code !== 0) throw new Error(data.msg);
        return data.data.image_url;
    }

    // ========== UI 更新函数 ==========
    function displayScenarioAndOptions(scenario, options) {
        document.getElementById('scenario').innerText = scenario;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        // 检查options是否为对象
        if (options && typeof options === 'object') {
            for (const [key, text] of Object.entries(options)) {
                const btn = document.createElement('button');
                btn.innerText = `${key}. ${text}`;
                btn.onclick = () => onOptionSelect(key, false, text);
                optionsDiv.appendChild(btn);
            }
        } else {
            console.error('options参数无效:', options);
            optionsDiv.innerHTML = '<div style="color: red;">无法加载选项，请刷新页面重试</div>';
        }
        
        document.getElementById('analysis').style.display = 'none';
        document.getElementById('customInput').value = '';
    }

    function displayAnalysis(analysis) {
        const analysisDiv = document.getElementById('analysis');
        analysisDiv.innerHTML = analysis;
        analysisDiv.style.display = 'block';
        document.getElementById('options').innerHTML = '';
        document.getElementById('customOption').style.display = 'none';
    }

    async function fetchAndShowImage(prompt) {
        if (!IMAGE_PLUGIN_ID) return;
        const container = document.getElementById('imageContainer');
        const loadingDiv = document.getElementById('loading');
        container.innerHTML = '';
        loadingDiv.style.display = 'block';
        try {
            const imgUrl = await generateImage(prompt);
            loadingDiv.style.display = 'none';
            if (imgUrl) container.innerHTML = `< img src="${imgUrl}" alt="情景图片">`;
        } catch (err) {
            loadingDiv.style.display = 'none';
            container.innerHTML = `<div style="color:red;">图片生成失败: ${err.message}</div>`;
        }
    }

    // ========== 核心逻辑 ==========
    /**
     * 获取下一轮情景和选项（非最终轮）
     */
    async function fetchNextRound(isCustom = false, customContent = '') {
        try {
            const params = {
                profession,
                round: currentRound,
                history: historySummary,
                is_end: false,
                is_custom: isCustom,
                custom_content: customContent
            };
            console.log('调用Coze工作流参数:', params);
            const data = await callWorkflow(params);
            console.log('Coze工作流返回数据:', data);
            
            // 检查数据结构
            let content;
            if (data.content) {
                // 如果有content字段，解析它
                content = JSON.parse(data.content);
            } else {
                // 否则直接使用data
                content = data;
            }
            console.log('解析后的内容:', content);
            currentScenario = content.scenario;
            
            // 检查options是否为字符串，如果是则解析为对象
            if (typeof content.options === 'string') {
                try {
                    // 尝试直接解析
                    currentOptions = JSON.parse(content.options);
                } catch (parseError) {
                    console.error('解析options失败:', parseError);
                    // 尝试修复options字符串格式
                    try {
                        // 确保options字符串是有效的JSON对象
                        let fixedOptions = content.options;
                        // 检查是否缺少外层大括号
                        if (!fixedOptions.startsWith('{')) {
                            fixedOptions = '{' + fixedOptions;
                        }
                        if (!fixedOptions.endsWith('}')) {
                            fixedOptions = fixedOptions + '}';
                        }
                        currentOptions = JSON.parse(fixedOptions);
                        console.log('修复后解析的options:', currentOptions);
                    } catch (fixError) {
                        console.error('修复options失败:', fixError);
                        // 如果修复失败，使用默认选项
                        currentOptions = {
                            A: '选项A',
                            B: '选项B',
                            C: '选项C',
                            D: '选项D'
                        };
                        console.log('使用默认选项:', currentOptions);
                    }
                }
            } else {
                currentOptions = content.options || {};
            }
            console.log('解析后的options:', currentOptions);
            
            displayScenarioAndOptions(currentScenario, currentOptions);
            // 生成图片（可选）
            await fetchAndShowImage(currentScenario);
        } catch (error) {
            console.error('获取情景失败:', error);
            document.getElementById('scenario').innerText = `错误：获取情景失败 - ${error.message}`;
            document.getElementById('options').innerHTML = '';
        }
    }

    /**
     * 获取最终分析报告
     */
    async function fetchFinalAnalysis() {
        try {
            const params = {
                profession,
                round: 5,
                history: historySummary,
                is_end: true,
                is_custom: false,
                custom_content: ''
            };
            console.log('调用Coze工作流参数（最终分析）:', params);
            const data = await callWorkflow(params);
            console.log('Coze工作流返回数据（最终分析）:', data);
            
            // 检查数据结构
            let content;
            if (data.content) {
                // 如果有content字段，解析它
                content = JSON.parse(data.content);
            } else {
                // 否则直接使用data
                content = data;
            }
            console.log('解析后的内容（最终分析）:', content);
            displayAnalysis(content.analysis);
            // 最终轮不需要图片
        } catch (error) {
            console.error('获取最终分析失败:', error);
            document.getElementById('scenario').innerText = `错误：获取最终分析失败 - ${error.message}`;
            document.getElementById('options').innerHTML = '';
        }
    }

    /**
     * 用户选择选项后的处理
     * @param {string} optionKey 选项键（A/B/C/D 或自定义标识）
     * @param {boolean} isCustom 是否为自定义选项
     * @param {string} customText 自定义内容（仅当 isCustom=true 时有效）
     */
    async function onOptionSelect(optionKey, isCustom = false, customText = '') {
        let choiceDesc;
        if (isCustom) {
            choiceDesc = `自定义选项：${customText}`;
        } else {
            choiceDesc = `选项${optionKey}（${currentOptions[optionKey]}）`;
        }

        // 将本轮的情景和选择添加到历史摘要中
        historySummary += `第${currentRound}轮情景：${currentScenario}\n`;
        historySummary += `用户选择：${choiceDesc}\n\n`;

        // 轮次增加
        currentRound++;

        // 判断是否结束
        if (currentRound > 5) {
            // 故事结束，获取最终分析
            await fetchFinalAnalysis();
        } else {
            // 继续下一轮（下一轮不携带自定义参数，因为本轮已记录）
            await fetchNextRound(false, '');
        }
    }

    // 处理自定义提交
    function submitCustomOption() {
        const customText = document.getElementById('customInput').value.trim();
        if (!customText) {
            alert('请输入你的行动方案');
            return;
        }
        onOptionSelect('E', true, customText);
    }

    /**
     * 开始故事（用户选择职业后调用）
     */
    async function startStory(selectedProfession) {
        profession = selectedProfession;
        currentRound = 1;
        historySummary = '';

        // 获取第一轮情景和选项
        await fetchNextRound(false, '');
    }

    // 从URL参数获取职业
    function getProfessionFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('profession');
    }

    // 页面加载时自动开始故事
    window.onload = async function() {
        const professionFromUrl = getProfessionFromUrl();
        if (professionFromUrl) {
            await startStory(professionFromUrl);
        } else {
            // 如果没有职业参数，显示错误信息
            document.getElementById('scenario').innerText = '错误：未提供职业参数，请从select-role页面进入。';
            document.getElementById('options').innerHTML = '';
            document.getElementById('customOption').style.display = 'none';
        }
    };

    // 绑定自定义按钮事件
    document.getElementById('customBtn').addEventListener('click', submitCustomOption);
</script>
</body>
</html>
